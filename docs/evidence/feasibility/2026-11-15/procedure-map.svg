<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img">
<title>Soluzione di 2x + 3 = 19</title>
<rect width="760" height="500" fill="white"/>
<rect x="100" y="32" width="430" height="54" rx="6" fill="#EDF5F6" stroke="#157D91"/>
<text x="315" y="65" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#172B3A">Problema: 2x + 3 = 19</text>
<rect x="100" y="162" width="430" height="54" rx="6" fill="#EDF5F6" stroke="#157D91"/>
<text x="315" y="195" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#172B3A">Due kit: 2x = 16</text>
<rect x="100" y="292" width="430" height="54" rx="6" fill="#EDF5F6" stroke="#157D91"/>
<text x="315" y="325" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#172B3A">Un kit: x = 8 euro</text>
<rect x="100" y="422" width="430" height="54" rx="6" fill="#EDF5F6" stroke="#157D91"/>
<text x="315" y="455" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#172B3A">Verifica: 2 × 8 + 3 = 19</text>
<path d="M315 86 V154" stroke="#157D91" stroke-width="2" fill="none"/>
<path d="M310 154 L320 154 L315 162 Z" fill="#157D91"/>
<text x="332" y="130.0" font-family="sans-serif" font-size="16" fill="#172B3A">Sottraiamo 3 da entrambi i membri</text>
<path d="M315 216 V284" stroke="#157D91" stroke-width="2" fill="none"/>
<path d="M310 284 L320 284 L315 292 Z" fill="#157D91"/>
<text x="332" y="260.0" font-family="sans-serif" font-size="16" fill="#172B3A">Dividiamo entrambi i membri per 2</text>
<path d="M315 346 V414" stroke="#157D91" stroke-width="2" fill="none"/>
<path d="M310 414 L320 414 L315 422 Z" fill="#157D91"/>
<text x="332" y="380.0" font-family="sans-serif" font-size="16" fill="#172B3A">Sostituiamo x con 8 nell’equazione iniziale:</text>
<text x="332" y="400.0" font-family="sans-serif" font-size="16" fill="#172B3A">otteniamo 19 = 19</text>
</svg>
