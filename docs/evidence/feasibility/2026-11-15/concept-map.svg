<text x="315" y="65" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#172B3A">Equazione</text>
<rect x="100" y="162" width="430" height="54" rx="6" fill="#EDF5F6" stroke="#157D91"/>
<text x="315" y="195" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#172B3A">Trasformazioni equivalenti</text>
